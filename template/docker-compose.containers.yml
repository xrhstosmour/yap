# Combine with core services:
#   docker compose -f docker-compose.yml -f docker-compose.containers.yml up -d
#
# Requires the containers repo cloned alongside this project:
#   git clone https://github.com/xrhstosmour/containers.git ../containers
#
# Create the shared network once:
#   docker network create internal

include:
  - path: ../../containers/networking/proxies/traefik/docker-compose.yml
  - path: ../../containers/monitoring/glitchtip/docker-compose.yml
  - path: ../../containers/databases/manage/metabase/docker-compose.yml
  - path: ../../containers/databases/manage/pgadmin4/docker-compose.yml
  - path: ../../containers/development/mailpit/docker-compose.yml

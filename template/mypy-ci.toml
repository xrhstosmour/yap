[tool.mypy]
python_version = "3.14"
exclude = ["tests/", "venv", ".venv", "alembic/versions"]
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "celery.*",
    "sentry_sdk.*",
    "passlib.*",
    "jose.*",
    "pyotp.*",
    "qrcode.*",
    "PIL.*",
    "boto3.*",
    "webauthn.*",
    "pybreaker.*",
    "opentelemetry.*",
    "structlog.*",
    "tenacity.*",
    "email_validator.*",
    "jinja2.*",
    "aiosqlite.*",
    "greenlet.*",
    "amqp.*",
    "redbeat.*",
]
ignore_missing_imports = true

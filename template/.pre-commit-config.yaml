repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        # Runs against the project's own pinned/resolved ruff (via uv)
        # instead of a separately pinned ruff-pre-commit rev, which drifts
        # out of sync with pyproject.toml's unbounded `ruff>=0.8.0` and
        # produces false failures unrelated to real code issues. Scoped to
        # app/tests, matching CI, not the whole repo (e.g. scripts/).
        entry: uv run ruff check --fix app/ tests/
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format app/ tests/
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy
        # Same rationale as ruff above: runs against the project's real
        # uv-managed environment instead of the isolated mirrors-mypy hook,
        # whose additional_dependencies list can never track the full
        # dependency graph and produced hundreds of false import-not-found
        # errors.
        entry: uv run mypy app/ --config-file mypy-ci.toml
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: detect-aws-credentials
        # Fails outright (exit 2) on machines with no AWS CLI credentials
        # file configured, which is the common case for this project.
        args: [--allow-missing-credentials]
      - id: check-merge-conflict
      - id: name-tests-test
        # This project uses pytest's `test_*.py` convention, not the hook's
        # default `*_test.py`.
        args: [--pytest-test-first]

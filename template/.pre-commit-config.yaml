repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        args: [--config-file, mypy-ci.toml]
        additional_dependencies:
          - pydantic>=2.6.0
          - fastapi>=0.115.0
          - sqlmodel>=0.0.22

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: detect-aws-credentials
        # Fails outright (exit 2) on machines with no AWS CLI credentials
        # file configured, which is the common case for this project.
        args: [--allow-missing-credentials]
      - id: check-merge-conflict
      - id: name-tests-test
        # This project uses pytest's `test_*.py` convention, not the hook's
        # default `*_test.py`.
        args: [--pytest-test-first]

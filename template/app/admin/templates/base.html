<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Never let this surface into a search index or a referrer. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>{% block title %}Administration{% endblock %}</title>
    <link rel="stylesheet" href="/admin/static/admin.css" />
  </head>
  <body>
    {# A project's own admin pages list themselves here. Not shipped, so
       a project that adds none renders nothing. #}
    {% include "admin_navigation.html" ignore missing %}
    {% block body %}{% endblock %}
  </body>
</html>

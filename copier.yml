_templates_suffix: .template
_subdirectory: template

project_name:
  type: str
  help: "Enter the name of your project:"
  default: "yap"

project_slug:
  type: str
  help: "Enter a lowercase, URL-friendly version of the name of your project:"
  default: "{{ project_name|lower|replace('-', '_')|replace(' ', '_') }}"

description:
  type: str
  help: "Provide a brief description of your project:"
  default: "A production-ready FastAPI backend."

author_name:
  type: str
  help: "Enter the name of the project's author:"
  default: "Christos Mourtogiannis"

author_email:
  type: str
  help: "Enter the email address of the project's author:"
  default: "c.mourtogiannis@gmail.com"

jwt_secret_key:
  type: str
  help: "Secret key for JWT signing (leave empty to auto-generate):"
  default: ""

postgresql_password:
  type: str
  help: "Password for PostgreSQL (leave empty to auto-generate):"
  default: ""

first_superuser_full_name:
  type: str
  help: "Full name for the first superuser:"
  default: "Admin"

first_superuser_password:
  type: str
  help: "Password for the first superuser (leave empty to auto-generate):"
  default: ""

rabbitmq_password:
  type: str
  help: "Password for RabbitMQ (leave empty to auto-generate):"
  default: ""

sentry_dsn:
  type: str
  help: "Sentry/GlitchTip DSN (leave empty to skip):"
  default: ""

crypto_key:
  type: str
  help: "Encryption key (leave empty to auto-generate):"
  default: ""

_exclude:
  - __pycache__
  - "*.pyc"
  - .coverage
  - .cache
  - .venv
  - .env
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - .vscode
  - uv.lock
  - poetry.lock
  - poetry.toml

_tasks:
  - "./scripts/setup.sh"

_answers_file: .copier/.answers.yml

_message_after_copy: |

  Project {{ project_name }} is ready!

  Review .env for any values to replace before starting the server.

  Start the development server:
    cd {{ project_slug }} && uv run fastapi dev app/main.py --host 0.0.0.0 --port 8000


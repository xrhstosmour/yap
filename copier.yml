_templates_suffix: .template
_subdirectory: template

project_name:
  type: str
  help: "Enter the name of your project:"
  default: "yap"

project_slug:
  type: str
  help: "Enter a lowercase, URL-friendly version of the name of your project:"
  default: "{{ project_name|lower|replace('-', '_')|replace(' ', '_') }}"

description:
  type: str
  help: "Provide a brief description of your project:"
  default: "A production-ready FastAPI backend."

author_name:
  type: str
  help: "Enter the name of the project's author:"
  default: "Christos Mourtogiannis"

author_email:
  type: str
  help: "Enter the email address of the project's author:"
  default: "c.mourtogiannis@gmail.com"

jwt_secret_key:
  type: str
  help: "Secret key for JWT signing (leave empty to auto-generate):"
  default: ""

postgresql_password:
  type: str
  help: "Password for PostgreSQL (leave empty to auto-generate):"
  default: ""

first_superuser_full_name:
  type: str
  help: "Full name for the first superuser:"
  default: "Admin"

first_superuser_password:
  type: str
  help: "Password for the first superuser (leave empty to auto-generate):"
  default: ""

rabbitmq_password:
  type: str
  help: "Password for RabbitMQ (leave empty to auto-generate):"
  default: ""

redis_password:
  type: str
  help: "Password for Redis (leave empty to auto-generate):"
  default: ""

crypto_key:
  type: str
  help: "Encryption key (leave empty to auto-generate):"
  default: ""

include_traefik:
  type: bool
  help: "Include Traefik reverse proxy with Let's Encrypt?"
  default: false

traefik_host:
  type: str
  help: "Domain for Traefik dashboard:"
  default: "traefik.{{ project_slug }}.local"
  when: "{{ include_traefik }}"

timezone:
  type: str
  help: "Server timezone:"
  default: "UTC"

include_glitchtip:
  type: bool
  help: "Include GlitchTip/Sentry error tracking?"
  default: false

glitchtip_secret_key:
  type: str
  help: "Secret key for GlitchTip (leave empty to auto-generate):"
  default: ""
  when: "{{ include_glitchtip }}"

include_metabase:
  type: bool
  help: "Include Metabase BI dashboards?"
  default: false

metabase_read_only_password:
  type: str
  help: "Password for Metabase read-only database user (leave empty to auto-generate):"
  default: ""
  when: "{{ include_metabase }}"

include_pgadmin4:
  type: bool
  help: "Include pgAdmin4 database management?"
  default: false

pgadmin4_password:
  type: str
  help: "Password for pgAdmin4 (leave empty to auto-generate):"
  default: ""
  when: "{{ include_pgadmin4 }}"

include_mailpit:
  type: bool
  help: "Include Mailpit for email testing?"
  default: false

include_redis_commander:
  type: bool
  help: "Include Redis Commander for Redis management?"
  default: false

redis_commander_password:
  type: str
  help: "Password for Redis Commander (leave empty to auto-generate):"
  default: ""
  when: "{{ include_redis_commander }}"

include_flower:
  type: bool
  help: "Include Flower Celery monitoring?"
  default: false

flower_password:
  type: str
  help: "Password for Flower dashboard (leave empty to auto-generate):"
  default: ""
  when: "{{ include_flower }}"

include_redbeat:
  type: bool
  help: "Use RedBeat scheduler for Celery workers beat?"
  default: false

_exclude:
  - __pycache__
  - "*.pyc"
  - .coverage
  - .cache
  - .venv
  - .env
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - .vscode
  - uv.lock
  - poetry.lock
  - poetry.toml

_tasks:
  - "python3 scripts/assemble.py"
  - "./scripts/setup.sh"

_answers_file: .copier/.answers.yml

_message_after_copy: |

  Project {{ project_name }} is ready!

  Navigate to the project directory and review .env before starting the server.

  Start the development server:
    uv run fastapi dev app/main.py --host 0.0.0.0 --port 8000

  Start Celery:
    uv run celery -A app.celery_app worker --loglevel=info
  {%- if include_redbeat %}
    uv run celery -A app.celery_app beat -S redbeat.RedBeatScheduler -l info
  {%- else %}
    uv run celery -A app.celery_app beat --loglevel=info
  {%- endif %}

  URLs:
    Backend ReDoc:     http://localhost:8000/documentation
    Backend Swagger:   http://localhost:8000/try
  {%- if include_flower %}
    Flower:            http://localhost:5555
  {%- endif %}
  {%- if include_glitchtip %}
    GlitchTip:         http://localhost:8081
  {%- endif %}
  {%- if include_mailpit %}
    Mailpit:           http://localhost:8025
  {%- endif %}
  {%- if include_metabase %}
    Metabase:          http://localhost:3000
  {%- endif %}
  {%- if include_pgadmin4 %}
    pgAdmin4:          http://localhost:5050
  {%- endif %}
    RabbitMQ:          http://localhost:15672
  {%- if include_redis_commander %}
    Redis Commander:   http://localhost:8082
  {%- endif %}
  {%- if include_traefik %}
    Traefik:           http://{{ traefik_host or 'localhost' }}:8080
  {%- endif %}


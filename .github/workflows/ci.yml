name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Generate project via copier
        run: |
          pip install copier
          python3 -c "
          from copier import run_copy
          run_copy(
              src_path='${{ github.workspace }}',
              dst_path='.',
              data={
                  'project_name': 'yap',
                  'project_slug': 'yap',
                  'author_name': 'Christos Mourtogiannis',
                  'author_email': 'c.mourtogiannis@gmail.com',
                  'first_superuser_full_name': 'Admin',
                  'description': 'A production-ready FastAPI backend template',
              },
              defaults=True,
              overwrite=True,
              unsafe=True,
              skip_tasks=True,
          )
          "
      - run: uv sync --extra dev
      - run: uv run ruff check app/ tests/
      - run: uv run ruff format app/ tests/
      - run: uv run ruff format --check app/ tests/
      - run: uv run mypy app/ --config-file mypy-ci.toml
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          allow-ghsas: GHSA-69fq-xp46-6x23

  test:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Generate project via copier
        run: |
          pip install copier
          python3 -c "
          from copier import run_copy
          run_copy(
              src_path='${{ github.workspace }}',
              dst_path='.',
              data={
                  'project_name': 'yap',
                  'project_slug': 'yap',
                  'author_name': 'Christos Mourtogiannis',
                  'author_email': 'c.mourtogiannis@gmail.com',
                  'first_superuser_full_name': 'Admin',
                  'description': 'A production-ready FastAPI backend template',
              },
              defaults=True,
              overwrite=True,
              unsafe=True,
              skip_tasks=False,
          )
          "
      # Source the .env generated by setup.sh, then run tests.
      # .env values are overridden where needed for test-specific database.
      - run: |
          set -a
          source .env 2>/dev/null || true
          set +a
          uv run pytest tests/ -v --tb=short --cov=app --cov-report=xml
        env:
          POSTGRESQL_DATABASE: testdb
          ENVIRONMENT: local
      - name: Run smoke test
        run: |
          set -a
          source .env 2>/dev/null || true
          set +a
          uv run pytest tests/test_startup.py::test_api_smoke -v --tb=short
        env:
          POSTGRESQL_DATABASE: testdb
          ENVIRONMENT: local
      - uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          files: ./coverage.xml

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: template
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 1

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Generate project via copier
        run: |
          pip install copier
          python3 -c "
          from copier import run_copy
          run_copy(
              src_path='${{ github.workspace }}',
              dst_path='.',
              data={
                  'project_name': 'yap',
                  'project_slug': 'yap',
                  'author_name': 'Christos Mourtogiannis',
                  'author_email': 'c.mourtogiannis@gmail.com',
                  'first_superuser_full_name': 'Admin',
                  'description': 'A production-ready FastAPI backend template',
              },
              defaults=True,
              overwrite=True,
              unsafe=True,
              skip_tasks=True,
          )
          "
      - run: uv sync --extra dev
      - run: uv run ruff check app/ tests/
      - run: uv run ruff format --check app/ tests/
      - run: uv run mypy app/ --config-file mypy-ci.toml
      - name: Check single Alembic head
        run: |
          uv run python -c "
          import re
          from pathlib import Path

          versions = Path('migrations/versions')
          revisions = {}
          for migration in versions.glob('*.py'):
              content = migration.read_text()
              rev_match = re.search(
                  r'^revision:\s*str\s*=\s*\"([^\"]+)\"', content, re.MULTILINE
              )
              down_match = re.search(
                  r'^down_revision.*=\s*\"([^\"]+)\"\s*$', content, re.MULTILINE
              )
              if rev_match:
                  rev = rev_match.group(1)
                  parent = down_match.group(1) if down_match else None
                  revisions[rev] = parent

          heads = set(revisions.keys()) - {p for p in revisions.values() if p}
          assert len(heads) == 1, \
              f'Expected 1 Alembic head, got {len(heads)}: {heads}'
          print(f'Single Alembic head: {next(iter(heads))}')
          "
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        if: github.event_name == 'pull_request'
        with:
          allow-ghsas: GHSA-69fq-xp46-6x23

  test:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    services:
      postgresql:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a testpass ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        command: redis-server --requirepass testpass
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Generate project via copier
        run: |
          pip install copier
          python3 -c "
          from copier import run_copy
          run_copy(
              src_path='${{ github.workspace }}',
              dst_path='.',
              data={
                  'project_name': 'yap',
                  'project_slug': 'yap',
                  'author_name': 'Christos Mourtogiannis',
                  'author_email': 'c.mourtogiannis@gmail.com',
                  'first_superuser_full_name': 'Admin',
                  'description': 'A production-ready FastAPI backend template',
              },
              defaults=True,
              overwrite=True,
              unsafe=True,
              skip_tasks=False,
          )
          "
        env:
          POSTGRESQL_SERVER: localhost
          POSTGRESQL_PORT: 5432
          POSTGRESQL_USER: app
          POSTGRESQL_PASSWORD: testpass
          POSTGRESQL_DATABASE: testdb
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: testpass
          ENVIRONMENT: local
          SECRET_KEY: test-secret-key-for-ci-only-32ch
          CRYPTO_KEY: YesFc0OYzQ1FiRWQDvjrOEuqYf6DkE-b3lT-7Tqng78=
          RABBITMQ_PASSWORD: testpass
          FIRST_SUPERUSER_PASSWORD: testpass
      - run: |
          set -a
          source .env 2>/dev/null || true
          set +a
          export POSTGRESQL_USER=app
          export POSTGRESQL_PASSWORD=testpass
          export POSTGRESQL_DATABASE=testdb
          export REDIS_PASSWORD=testpass
          export REDIS_URL=redis://:testpass@localhost:6379/0
          uv run pytest tests/ -v --tb=short --cov=app --cov-report=xml -m "not slow"
        env:
          POSTGRESQL_SERVER: localhost
          POSTGRESQL_HOST: localhost
          POSTGRESQL_PORT: 5432
          POSTGRESQL_USER: app
          POSTGRESQL_PASSWORD: testpass
          POSTGRESQL_DATABASE: testdb
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: testpass
          REDIS_URL: redis://:testpass@localhost:6379/0
          ENVIRONMENT: local
      - name: Run smoke test
        run: |
          set -a
          source .env 2>/dev/null || true
          set +a
          export POSTGRESQL_USER=app
          export POSTGRESQL_PASSWORD=testpass
          export POSTGRESQL_DATABASE=testdb
          export REDIS_PASSWORD=testpass
          export REDIS_URL=redis://:testpass@localhost:6379/0
          uv run pytest tests/test_startup.py::test_api_smoke -v --tb=short
        env:
          POSTGRESQL_SERVER: localhost
          POSTGRESQL_HOST: localhost
          POSTGRESQL_PORT: 5432
          POSTGRESQL_USER: app
          POSTGRESQL_PASSWORD: testpass
          POSTGRESQL_DATABASE: testdb
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: testpass
          REDIS_URL: redis://:testpass@localhost:6379/0
          ENVIRONMENT: local
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          files: ./coverage.xml

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: template
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Report medium-severity findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: template
          severity: MEDIUM
          exit-code: 0
